name: promo · approve
# The repo owner's comment on a promo issue: /post, /post anyway, /skip, /caption …
# Only OWNER comments run this; anyone else's comment is ignored.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # delete a skipped clip's release
  issues: write

jobs:
  act:
    # job-level, so other people's comments (which skip the job) never take
    # a slot in the queue and cancel a pending /post
    concurrency:
      group: promo-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'promo') &&
      github.event.issue.state == 'open' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Act on the command
        working-directory: promo
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IG_API: ${{ vars.IG_API || 'facebook' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node approve.mjs
