name: promo · film a storm
# Every two hours: listen to the live feed, film the most newsworthy storm on
# the real Downstrike map, and open an issue asking whether to post it.
# Nothing reaches Instagram until the repo owner comments /post on that issue.
# Kill switch: set the repository variable PROMO_ENABLED to "false".

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      at:
        description: "lat,lon to film (leave blank to pick the best storm on Earth)"
        required: false
      force:
        description: "Make a clip even if no storm clears the bar"
        type: boolean
        default: false

permissions:
  contents: write   # the clip is attached to a pre-release
  issues: write     # the approval issue

concurrency:
  group: promo-capture
  cancel-in-progress: false

jobs:
  film:
    if: vars.PROMO_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: promo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo/package-lock.json

      - name: Install the renderer
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter

      - name: Restore clip history
        uses: actions/cache/restore@v5
        with:
          path: promo/.state
          key: promo-state-${{ github.run_id }}
          restore-keys: promo-state-

      - name: Film
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AT: ${{ inputs.at }}
          FORCE: ${{ inputs.force }}
        run: |
          mkdir -p .state
          node capture.mjs --out out ${AT:+--at "$AT"} $([ "$FORCE" = "true" ] && echo --force)

      - name: Open the approval issue
        if: hashFiles('promo/out/clip.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node candidate.mjs out

      - name: Save clip history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: promo/.state
          key: promo-state-${{ github.run_id }}
