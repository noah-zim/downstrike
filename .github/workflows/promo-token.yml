name: promo · token check
# Weekly: prove the Instagram token still works (and refresh it in instagram mode).
# If this fails, GitHub emails you; fix the token before the next /post.

on:
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check token
        working-directory: promo
        env:
          IG_API: ${{ vars.IG_API || 'facebook' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PROMO_PAT: ${{ secrets.PROMO_PAT }}
        run: node token.mjs
