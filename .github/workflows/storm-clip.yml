# Records a vertical clip of live lightning on downstrike.app and publishes it
# to the `clips` branch, where the social bot picks it up. Run on demand only.
name: storm-clip
on:
  # PRs that change the recorder record a test clip, so changes are checked before merge
  pull_request:
    paths: ['.github/workflows/storm-clip.yml', 'tools/social/record_clip.js']
  workflow_dispatch:
    inputs:
      lat: { description: 'Latitude (blank = most active storm on Earth)', required: false, default: '' }
      lon: { description: 'Longitude', required: false, default: '' }
      zoom: { description: 'Map zoom', required: false, default: '8.4' }
      seconds: { description: 'Clip length', required: false, default: '25' }
      name: { description: 'Output file stem, e.g. 2026-10-09-isaias', required: true }
permissions:
  contents: write
concurrency: { group: "storm-clip-${{ github.event_name }}", cancel-in-progress: false }
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # an apt mirror occasionally hangs; bound each attempt and retry once
      - name: Install Chromium and ffmpeg
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1.56.1
          for i in 1 2; do
            timeout 180 bash -c 'npx playwright install --with-deps chromium && sudo apt-get install -y ffmpeg' && break
            [ "$i" = 2 ] && exit 1
          done
      - name: Record
        run: |
          node tools/social/record_clip.js "clip.mp4" ${{ inputs.lat && format('{0} {1} {2} {3}', inputs.lat, inputs.lon, inputs.zoom, inputs.seconds) || '' }}
      # PR runs only check that recording works; they never touch the clips branch
      - name: Keep PR test clip as a run artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with: { name: pr-test-clip, path: "clip.*", retention-days: 3 }
      - name: Publish to clips branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "downstrike-clips"; git config user.email "actions@users.noreply.github.com"
          mkdir /tmp/out && mv clip.mp4 "/tmp/out/${{ inputs.name }}.mp4" && mv clip.json "/tmp/out/${{ inputs.name }}.json"
          git checkout --orphan clips-tmp && git rm -rqf . && cp /tmp/out/* . && git add *.mp4 *.json
          git commit -qm "clip ${{ inputs.name }}" && git push -f origin HEAD:clips
